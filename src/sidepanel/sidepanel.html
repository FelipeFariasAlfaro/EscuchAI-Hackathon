<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EscuchAI</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Cabecera -->
  <header class="appbar">
    <div class="brand">
      <span class="mic" aria-hidden="true">&#127908;</span>
      <span class="brand-name">EscuchAI</span>
    </div>
    <button class="min" data-i18n-title="app.minimize" title="Minimizar" aria-label="Minimizar">&#8211;</button>
  </header>

  <!-- Tabs principales -->
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="reunion" data-i18n="tab.reunion" role="tab">Reunión</button>
    <button class="tab" data-tab="historial" data-i18n="tab.historial" role="tab">Historial</button>
    <button class="tab" data-tab="ajustes" data-i18n="tab.ajustes" role="tab">Ajustes</button>
    <button class="tab" data-tab="sobre" data-i18n="tab.sobre" role="tab">Sobre</button>
  </nav>

  <!-- ===================== TAB REUNIÓN ===================== -->
  <section class="panel active" data-panel="reunion">
    <div class="rec-row">
      <button id="recBtn" class="rec-btn">
        <span class="rec-dot" aria-hidden="true"></span>
        <span class="rec-label" data-i18n="rec.start">Iniciar grabación</span>
      </button>
      <label class="lang-pick" for="langSelect">
        <span class="sr-only" data-i18n="lang.meeting">Idioma de la reunión</span>
        <select id="langSelect" data-i18n-title="lang.meeting" title="Idioma de la reunión">
          <option value="es" data-i18n="lang.es">Español</option>
          <option value="en" data-i18n="lang.en">English</option>
          <option value="auto" data-i18n="lang.auto">Auto</option>
        </select>
      </label>
    </div>

    <!-- Sub-tabs -->
    <nav class="subtabs" role="tablist">
      <button class="subtab active" data-subtab="transcripcion" data-i18n="subtab.transcripcion" role="tab">Transcripción</button>
      <button class="subtab disabled" data-subtab="tareas" data-i18n="subtab.tareas" data-i18n-title="subtab.soon" role="tab" title="Próximamente" disabled>Tareas</button>
      <button class="subtab disabled" data-subtab="conflictos" data-i18n="subtab.conflictos" data-i18n-title="subtab.soon" role="tab" title="Próximamente" disabled>Conflictos</button>
      <button class="subtab disabled" data-subtab="participacion" data-i18n="subtab.participacion" data-i18n-title="subtab.soon" role="tab" title="Próximamente" disabled>Participación</button>
      <button class="subtab disabled" data-subtab="alertas" data-i18n="subtab.alertas" data-i18n-title="subtab.soon" role="tab" title="Próximamente" disabled>Alertas</button>
    </nav>

    <!-- Área de transcripción -->
    <div class="transcript-area" id="transcriptArea">
      <p class="placeholder" id="transcriptPlaceholder" data-i18n="transcript.placeholder">La transcripción aparecerá aquí al iniciar la grabación.</p>
    </div>

    <!-- Acciones sobre la transcripción -->
    <div class="actions">
      <button id="summarizeBtn" class="action" data-i18n-title="action.summarize.title" title="Resumir la reunión con la IA">&#9776; <span data-i18n="action.summarize">Resumir</span></button>
      <button id="copyBtn" class="action" data-i18n-title="action.copy.title" title="Copiar la transcripción">&#128203; <span data-i18n="action.copy">Copiar</span></button>
      <button id="txtBtn" class="action" data-i18n-title="action.txt.title" title="Exportar como TXT">&#11015; <span data-i18n="action.txt">TXT</span></button>
      <button id="mdBtn" class="action" data-i18n-title="action.md.title" title="Exportar como Markdown">&#11015; <span data-i18n="action.md">MD</span></button>
    </div>

    <!-- Caja de chat -->
    <div class="chat-box">
      <input id="chatInput" class="chat-input" type="text"
             data-i18n-placeholder="chat.placeholder"
             placeholder="Pregunta a la IA, ej: resume lo que dijo Pepito sobre el sistema X" />
      <button id="chatSend" class="chat-send" data-i18n-title="chat.send" title="Enviar" aria-label="Enviar">&#10148;</button>
    </div>
  </section>

  <!-- ===================== TAB HISTORIAL ===================== -->
  <section class="panel" data-panel="historial">
    <div class="empty-tab">
      <p data-i18n="history.title">Historial de grabaciones.</p>
      <p class="muted" data-i18n="history.soon">Próximamente.</p>
    </div>
  </section>

  <!-- ===================== TAB AJUSTES ===================== -->
  <section class="panel" data-panel="ajustes">
    <div id="settingsRoot" class="settings"></div>
  </section>

  <!-- ===================== TAB SOBRE ===================== -->
  <section class="panel" data-panel="sobre">
    <div id="aboutRoot" class="about"></div>
  </section>

  <!-- Modal genérico -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <p id="modalMessage"></p>
      <div class="modal-actions">
        <button id="modalCancel" class="btn-ghost hidden" data-i18n="modal.cancel">Cancelar</button>
        <button id="modalOk" class="btn-accent" data-i18n="modal.ok">Entendido</button>
      </div>
    </div>
  </div>

  <!-- Selección de idioma (primer uso) -->
  <div id="langSetupBackdrop" class="modal-backdrop hidden">
    <div class="modal lang-setup" role="dialog" aria-modal="true">
      <h2 id="setupTitle">Elige el idioma de EscuchAI / Choose your language</h2>
      <p class="muted" id="setupSubtitle">Puedes cambiarlo luego en Ajustes. / You can change it later in Settings.</p>
      <div class="lang-setup-options">
        <button class="btn-accent" data-setlang="es">Español</button>
        <button class="btn-accent" data-setlang="en">English</button>
      </div>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
